name: build
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pinned to 26.04: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (runner-images#14748); opting in explicitly keeps runs predictable.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # setup-go caches GOCACHE/GOMODCACHE by default; cache: true makes it
      # explicit so the intent survives future action upgrades.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy
      - run: git diff --exit-code
      - run: go build -race ./...
      - run: go test -race -failfast -covermode=atomic -coverprofile=coverage.out ./...
      # Coverage ratchet: the goal is 80% (kept visible as the target in
      # every run summary), but gating on it outright would leave CI red
      # until the ~13k-statement gap in the TUI packages is closed. The
      # floor instead pins the last measured baseline so coverage can only
      # move up: raise COVERAGE_FLOOR whenever coverage grows past it, and
      # never lower it to make a change pass.
      #
      # Go 1.27.2 corrected statement counting for large composite
      # literals (the styles package went from ~27k to ~1k statements for
      # the same blocks), so the same tests now measure 51.9% instead of
      # 67.3%. The floor is re-baselined to that measurement; this is a
      # measurement change, not a coverage regression.
      - name: Enforce coverage floor
        env:
          COVERAGE_FLOOR: "51"
          COVERAGE_TARGET: "80"
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          pct="${total%\%}"
          echo "### Total coverage: $total (floor: ${COVERAGE_FLOOR}%, target: ${COVERAGE_TARGET}%)" >> "$GITHUB_STEP_SUMMARY"
          awk -v c="$pct" -v t="$COVERAGE_FLOOR" 'BEGIN { exit (c + 0 >= t + 0) ? 0 : 1 }' || {
            echo "Coverage $total dropped below the ${COVERAGE_FLOOR}% floor (target: ${COVERAGE_TARGET}%)" >&2
            exit 1
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
