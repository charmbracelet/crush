name: lint
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Pinned to 26.04: ubuntu-latest migrates to Ubuntu 26 on 2026-10-19
    # (runner-images#14748); opting in explicitly keeps runs predictable.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.15.0 bundles x/tools v0.52, which can read the export data
          # produced by Go 1.27.2 (required by fantasy v0.45.5). v2.13.1
          # fails with a typecheck error on that toolchain.
          args: --config=.golangci.yml --timeout=10m ./...
          version: v2.15.0
