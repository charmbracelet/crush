# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: ultra

before:
  hooks:
    - go mod download
    - rm -rf completions manpages
    - mkdir -p completions manpages
    - sh -c 'go run . completion bash >./completions/ultra.bash'
    - sh -c 'go run . completion zsh >./completions/ultra.zsh'
    - sh -c 'go run . completion fish >./completions/ultra.fish'
    - sh -c 'go run . man | gzip -c >./manpages/ultra.1.gz'

builds:
  - env:
      - CGO_ENABLED=0
      - GOEXPERIMENT=greenteagc
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X github.com/asx8678/ultra/internal/version.Version={{.Version}}
    flags:
      - -trimpath

archives:
  - name_template: >-
      ultra_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm}}v{{ . }}{{ end }}
    wrap_in_directory: true
    files:
      - README*
      - LICENSE*
      - manpages/*
      - completions/*
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

source:
  enabled: true

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^(build|ci|docs|test)(\\(.+\\))?:"
      - "^chore(\\(deps\\))?:"
      - "^v\\d"
      - "^Merge "

release:
  prerelease: auto
