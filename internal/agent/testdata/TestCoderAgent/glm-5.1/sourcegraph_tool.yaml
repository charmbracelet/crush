nary.go\n\n\tbaseUrl := getInstallBaseUrl()\n\treturn fmt.Sprintf(\"%s/installer-builds/serverless-%s-%s\", baseUrl, osType, architecture)\n}\n\nfunc updateInstaller() {\n\tuseSpinner := !version.IsCIEnvironment()\n\tvar updateSpinner *spinner.Spinner\n\tif useSpinner {\n\t\tupdateSpinner = spinner.New(spinner.CharSets[14], 100*time.Millisecond)\n\t\tupdateSpinner.Suffix = \" Updating\"\n\t\tupdateSpinner.Color(\"red\")\n\t\tupdateSpinner.Start()\n\t\tdefer func() {\n\t\t\tupdateSpinner.Stop()\n\t\t}()\n\t} else {\n\t\tfmt.Fprintln(os.Stderr, \"Updating installer...\")\n\t}\n\t// Get the correct binary name based on OS and architecture\n\tbinaryName := getBinaryName()\n\tclient := http.Client{Timeout: 2 * time.Minute}\n\t// Download the latest installer\n\tresponse, err := client.Get(binaryName)\n\tif err != nil {\n\t\tpanic(fmt.Errorf(\"downloading installer from %s: %w\", binaryName, err))\n\t}\n\tdefer response.Body.Close()\n\tif response.StatusCode != http.StatusOK {\n\t\tlimited := io.LimitReader(response.Body, 2048)\n\t\tb, _ := io.ReadAll(limited)\n\t\tpanic(fmt.Errorf(\"installer download failed: GET %s returned %s; body: %s\", binaryName, response.Status, strings.TrimSpace(string(b))))\n\t}\n\n\t// Get the path of the current executable\n\tname, err := os.Executable()\n\tif err != nil {\n\t\tpanic(fmt.Errorf(\"locating executable: %w\", err))\n\t}\n\tname, err = filepath.EvalSymlinks(name)\n\tif err != nil {\n\t\tpanic(fmt.Errorf(\"resolving executable symlink: %w\", err))\n\t}\n\tnewName := name + \".new\"\n\toldName := name + \".old\"\n\t// Create a new file to write the downloaded installer\n\tout, err := os.OpenFile(newName, os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0755)\n\tif err != nil {\n\t\tpanic(fmt.Errorf(\"creating temp installer %s: %w\", newName, err))\n\t}\n\t// Write the downloaded installer to .new file\n\t_, err = io.Copy(out, response.Body)\n\tif err != nil {\n\t\tpanic(fmt.Errorf(\"writing temp installer %s: %w\", newName, err))\n\t}\n\t// Remove the .old (from the last update) if it exists\n\tif _, err := os.Stat(oldName); err == nil {\n\t\tif err := os.Remove(oldName); err != nil {\n\t\t\tpanic(fmt.Errorf(\"removing old installer %s: %w\", oldName, err))\n\t\t}\n\t}\n\t// Rename the current executable to .old\n\tif err := os.Rename(name, oldName); err != nil {\n\t\tpanic(fmt.Errorf(\"renaming %s to %s: %w\", name, oldName, err))\n\t}\n\n\t// Close the file to avoid \"The process cannot access the file because it is being used by another process.\" error\n\tout.Close()\n\n\t// Rename the .new installer to the current executable\n\tif err := os.Rename(newName, name); err != nil {\n\t\tpanic(fmt.Errorf(\"renaming %s to %s: %w\", newName, name, err))\n\t}\n\tif !useSpinner {\n\t\tfmt.Fprintln(os.Stderr, \"Installer update complete\")\n\t}\n}\n\nfunc getLocalServerlessConfigFilePath() string {\n\tsupportedFilenames := []string{\"serverless\", \"serverless-compose\", \"serverless.containers\", \"serverless.ai\"}\n\tsupportedExtensions := []string{\"yml\", \"yaml\", \"js\", \"ts\", \"cjs\", \"mjs\", \"json\"}\n\tcwd, err := os.Getwd()\n\tif err != nil {\n\t\tpanic(err)\n\t}\n\t// Check if the current working directory contains a supported serverless config file\n\tfor _, baseName := range supportedFilenames {\n\t\tfor _, extension := range supportedExtensions {\n\t\t\tfilePath := filepath.Join(cwd, baseName+\".\"+extension)\n\t\t\tif _, err := os.Stat(filePath); err == nil {\n\t\t\t\treturn filePath\n\t\t\t}\n\t\t}\n\t}\n\n\treturn \"\"\n}\n\nfunc main() {\n\tdefer func() {\n\t\tif r := recover(); r != nil {\n\t\t\tfmt.Fprintf(os.Stderr, \"Error: %s\\n\", r)\n\t\t\tos.Exit(1)\n\t\t}\n\t}()\n\n\tif value, ok := os.LookupEnv(\"SLS_DISABLE_EXTRA_CA_CERTS\"); ok \u0026\u0026 value != \"false\" {\n\t\t// Configure HTTP clients to honor extra CA certs from env\n\t\tcerts.ConfigureHTTPRootCAs()\n\t}\n\n\tcreateServerlessDirectoryIfNotExists()\n\n\tif isUpdateCommand() {\n\t\tupdateInstaller()\n\t}\n\n\trunLocalVersionIfAvailable()\n\n\targs := os.Args[1:]\n\n\tconfigFilePath := resolveConfigFilePath(args)\n\n\trelease, err := version.GetFrameworkVersion(configFilePath, shouldCheckForUpdates())\n\tif err != nil {\n\t\tfmt.Fprintf(os.Stderr, \"Error getting framework version: %v\\n\", err)\n\t\tos.Exit(1)\n\t}\n\n\tif release == nil {\n\t\tfmt.Fprintln(os.Stderr, \"Could not find a valid version to run\")\n\t\tos.Exit(1)\n\t}\n\tif ok := doesNodeExistAndIsItAccessible(); !ok {\n\t\tfmt.Fprintln(os.Stderr, \"Nodejs is not installed, please install Nodejs and run the command again\")\n\t\tos.Exit(1)\n\t}\n\n\tif ok := isNodeUpToDate(); !ok {\n\t\tfmt.Fprintln(os.Stderr, \"Your Nodejs version is too old, please upgrade to Node 18 or newer and rerun Serverless\")\n\t\tos.Exit(1)\n\t}\n\tif isUpdateCommand() {\n\t\tfmt.Printf(\"✔ Update completed\\n\")\n\t\tif release.LatestVersion != nil \u0026\u0026 *release.LatestVersion != release.Version {\n\t\t\tcolor.Yellow(fmt.Sprintf(\"A new version, %s, has been released. Update your `frameworkVersion` property to use it\", *release.LatestVersion))\n\t\t}\n\t\treturn\n\t}\n\n\tenableSourcemaps := false\n\tfor _, arg := range args {\n\t\tif arg == \"--debug\" {\n\t\t\tenableSourcemaps = true\n\t\t}\n\t}\n\n\targs = append([]string{filepath.Join(release.ReleasePath, \"package/dist/sf-core.js\")}, args...)\n\n\tcmd := exec.Command(\"node\", args...)\n\tcmd.Stdout = os.Stdout\n\tcmd.Stderr = os.Stderr\n\tcmd.Stdin = os.Stdin\n\tcmd.Env = os.Environ()\n\n\tif enableSourcemaps {\n\t\tcmd.Env = append(cmd.Env, \"NODE_OPTIONS=--enable-source-maps\")\n\t}\n\n\tif err := cmd.Start(); err != nil {\n\t\tpanic(fmt.Errorf(\"starting node: %w\", err))\n\t}\n\n\t// Ignore SIGINT and SIGTERM signals to prevent Go from exiting before the child Node process\n\t// The child Node process has the same process group as the Go process, so it will receive the signals as well\n\t// and handle them accordingly. We''re not using signal.Ignore because the process does not have permission to ignore CTRL+C.\n\t// signal.Ignore(os.Interrupt) does nothing - Windows will still terminate the process when CTRL+C is pressed.\n\t// Instead we''re using signal.Notify which explicitly registers a console control handler.\n\tsigs := make(chan os.Signal, 1)\n\tsignal.Notify(sigs, os.Interrupt)\n\tgo func() {\n\t\t\u003c-sigs // Needed to discard signals\n\t}()\n\n\tif err := cmd.Wait(); err != nil {\n\t\tvar exitErr *exec.ExitError\n\t\tif errors.As(err, \u0026exitErr) {\n\t\t\tos.Exit(exitErr.ExitCode())\n\t\t}\n\t\tpanic(fmt.Errorf(\"node process wait: %w\", err))\n\t}\n}\n\nfunc isUpdateCommand() bool {\n\treturn len(os.Args) \u003e= 2 \u0026\u0026 os.Args[1] == \"update\"\n}\n"},"lineMatches":[{"preview":"func main() {","lineNumber":338,"offsetAndLengths":[[0,9]]},{"preview":"\tdefer func() {","lineNumber":339,"offsetAndLengths":[[7,4]]},{"preview":"package main","lineNumber":0,"offsetAndLengths":[[8,4]]},{"preview":"\tgo func() {","lineNumber":420,"offsetAndLengths":[[4,4]]},{"preview":"\t\tdefer func() {","lineNumber":253,"offsetAndLengths":[[8,4]]},{"preview":"func updateInstaller() {","lineNumber":245,"offsetAndLengths":[[0,4]]},{"preview":"func isNodeUpToDate() bool {","lineNumber":106,"offsetAndLengths":[[0,4]]},{"preview":"func isUpdateCommand() bool {","lineNumber":433,"offsetAndLengths":[[0,4]]},{"preview":"func getBinaryName() string {","lineNumber":222,"offsetAndLengths":[[0,4]]},{"preview":"func shouldCheckForUpdates() bool {","lineNumber":94,"offsetAndLengths":[[0,4]]},{"preview":"func runLocalVersionIfAvailable() {","lineNumber":147,"offsetAndLengths":[[0,4]]},{"preview":"func doesNodeExistAndIsItAccessible() bool {","lineNumber":130,"offsetAndLengths":[[0,4]]},{"preview":"func createServerlessDirectoryIfNotExists() {","lineNumber":31,"offsetAndLengths":[[0,4]]},{"preview":"func getLocalServerlessConfigFilePath() string {","lineNumber":318,"offsetAndLengths":[[0,4]]},{"preview":"func resolveConfigFilePath(args []string) string {","lineNumber":67,"offsetAndLengths":[[0,4]]},{"preview":"func getConfigPathFromArgs(args []string) (string, bool) {","lineNumber":44,"offsetAndLengths":[[0,4]]}]},{"__typename":"FileMatch","repository":{"name":"github.com/caddyserver/caddy"},"file":{"path":"cmd/main.go","url":"/r/github.com/caddyserver/caddy/-/blob/cmd/main.go","content":"// Copyright 2015 Matthew Holt and The Caddy Authors\n//\n// Licensed under the Apache License, Version 2.0 (the \"License\");\n// you may not use this file except in compliance with the License.\n// You may obtain a copy of the License at\n//\n//     http://www.apache.org/licenses/LICENSE-2.0\n//\n// Unless required by applicable law or agreed to in writing, software\n// distributed under the License is distributed on an \"AS IS\" BASIS,\n// WITHOUT WARRANTIES OR CONDITIONS OF ANY KIND, either express or implied.\n// See the License for the specific language governing permissions and\n// limitations under the License.\n\npackage caddycmd\n\nimport (\n\t\"bufio\"\n\t\"bytes\"\n\t\"encoding/json\"\n\t\"errors\"\n\t\"flag\"\n\t\"fmt\"\n\t\"io\"\n\t\"io/fs\"\n\t\"log\"\n\t\"log/slog\"\n\t\"net\"\n\t\"os\"\n\t\"path/filepath\"\n\t\"runtime\"\n\t\"runtime/debug\"\n\t\"strconv\"\n\t\"strings\"\n\t\"time\"\n\n\t\"github.com/KimMachineGun/automemlimit/memlimit\"\n\t\"github.com/caddyserver/certmagic\"\n\t\"github.com/spf13/pflag\"\n\t\"go.uber.org/automaxprocs/maxprocs\"\n\t\"go.uber.org/zap\"\n\t\"go.uber.org/zap/exp/zapslog\"\n\n\t\"github.com/caddyserver/caddy/v2\"\n\t\"github.com/caddyserver/caddy/v2/caddyconfig\"\n)\n\nfunc init() {\n\t// set a fitting User-Agent for ACME requests\n\tversion, _ := caddy.Version()\n\tcleanModVersion := strings.TrimPrefix(version, \"v\")\n\tua := \"Caddy/\" + cleanModVersion\n\tif uaEnv, ok := os.LookupEnv(\"USERAGENT\"); ok {\n\t\tua = uaEnv + \" \" + ua\n\t}\n\tcertmagic.UserAgent = ua\n\n\t// by using Caddy, user indicates agreement to CA terms\n\t// (very important, as Caddy is often non-interactive\n\t// and thus ACME account creation will fail!)\n\tcertmagic.DefaultACME.Agreed = true\n}\n\n// Main implements the main function of the caddy command.\n// Call this if Caddy is to be the main() of your program.\nfunc Main() {\n\tif len(os.Args) == 0 {\n\t\tfmt.Printf(\"[FATAL] no arguments provided by OS; args[0] must be command\\n\")\n\t\tos.Exit(caddy.ExitCodeFailedStartup)\n\t}\n\n\tif err := defaultFactory.Build().Execute(); err != nil {\n\t\tvar exitError *exitError\n\t\tif errors.As(err, \u0026exitError) {\n\t\t\tos.Exit(exitError.ExitCode)\n\t\t}\n\t\tos.Exit(1)\n\t}\n}\n\n// handlePingbackConn reads from conn and ensures it matches\n// the bytes in expect, or returns an error if it doesn''t.\nfunc handlePingbackConn(conn net.Conn, expect []byte) error {\n\tdefer conn.Close()\n\tconfirmationBytes, err := io.ReadAll(io.LimitReader(conn, 32))\n\tif err != nil {\n\t\treturn err\n\t}\n\tif !bytes.Equal(confirmationBytes, expect) {\n\t\treturn fmt.Errorf(\"wrong confirmation: %x\", confirmationBytes)\n\t}\n\treturn nil\n}\n\n// LoadConfig loads the config from configFile and adapts it\n// using adapterName. If adapterName is specified, configFile\n// must be also. If no configFile is specified, it tries\n// loading a default config file. The lack of a config file is\n// not treated as an error, but false will be returned if\n// there is no config available. It prints any warnings to stderr,\n// and returns the resulting JSON config bytes along with\n// the name of the loaded config file (if any).\n// The return values are:\n//   - config bytes (nil if no config)\n//   - config file used (\"\" if none)\n//   - adapter used (\"\" if none)\n//   - error, if any\nfunc LoadConfig(configFile, adapterName string) ([]byte, string, string, error) {\n\treturn loadConfigWithLogger(caddy.Log(), configFile, adapterName)\n}\n\nfunc isCaddyfile(configFile, adapterName string) (bool, error) {\n\tif adapterName == \"caddyfile\" {\n\t\treturn true, nil\n\t}\n\n\t// as a special case, if a config file starts with \"caddyfile\" or\n\t// has a \".caddyfile\" extension, and no adapter is specified, and\n\t// no adapter module name matches the extension, assume\n\t// caddyfile adapter for convenience\n\tbaseConfig := strings.ToLower(filepath.Base(configFile))\n\tbaseConfigExt := filepath.Ext(baseConfig)\n\tstartsOrEndsInCaddyfile := strings.HasPrefix(baseConfig, \"caddyfile\") || strings.HasSuffix(baseConfig, \".caddyfile\")\n\n\tif baseConfigExt == \".json\" {\n\t\treturn false, nil\n\t}\n\n\t// If the adapter is not specified,\n\t// the config file starts with \"caddyfile\",\n\t// the config file has an extension,\n\t// and isn''t a JSON file (e.g. Caddyfile.yaml),\n\t// then we don''t know what the config format is.\n\tif adapterName == \"\" \u0026\u0026 startsOrEndsInCaddyfile {\n\t\treturn true, nil\n\t}\n\n\t// adapter is not empty,\n\t// adapter is not \"caddyfile\",\n\t// extension is not \".json\",\n\t// extension is not \".caddyfile\"\n\t// file does not start with \"Caddyfile\"\n\treturn false, nil\n}\n\nfunc loadConfigWithLogger(logger *zap.Logger, configFile, adapterName string) ([]byte, string, string, error) {\n\t// if no logger is provided, use a nop logger\n\t// just so we don''t have to check for nil\n\tif logger == nil {\n\t\tlogger = zap.NewNop()\n\t}\n\n\t// specifying an adapter without a config file is ambiguous\n\tif adapterName != \"\" \u0026\u0026 configFile == \"\" {\n\t\treturn nil, \"\", \"\", fmt.Errorf(\"cannot adapt config without config file (use --config)\")\n\t}\n\n\t// load initial config and adapter\n\tvar config []byte\n\tvar cfgAdapter caddyconfig.Adapter\n\tvar err error\n\tif configFile != \"\" {\n\t\tif configFile == \"-\" {\n\t\t\tconfig, err = io.ReadAll(os.Stdin)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"reading config from stdin: %v\", err)\n\t\t\t}\n\t\t\tlogger.Info(\"using config from stdin\")\n\t\t} else {\n\t\t\tconfig, err = os.ReadFile(configFile)\n\t\t\tif err != nil {\n\t\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"reading config from file: %v\", err)\n\t\t\t}\n\t\t\tlogger.Info(\"using config from file\", zap.String(\"file\", configFile))\n\t\t}\n\t} else if adapterName == \"\" {\n\t\t// if the Caddyfile adapter is plugged in, we can try using an\n\t\t// adjacent Caddyfile by default\n\t\tcfgAdapter = caddyconfig.GetAdapter(\"caddyfile\")\n\t\tif cfgAdapter != nil {\n\t\t\tconfig, err = os.ReadFile(\"Caddyfile\")\n\t\t\tif errors.Is(err, fs.ErrNotExist) {\n\t\t\t\t// okay, no default Caddyfile; pretend like this never happened\n\t\t\t\tcfgAdapter = nil\n\t\t\t} else if err != nil {\n\t\t\t\t// default Caddyfile exists, but error reading it\n\t\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"reading default Caddyfile: %v\", err)\n\t\t\t} else {\n\t\t\t\t// success reading default Caddyfile\n\t\t\t\tconfigFile = \"Caddyfile\"\n\t\t\t\tlogger.Info(\"using adjacent Caddyfile\")\n\t\t\t}\n\t\t}\n\t}\n\n\tif yes, err := isCaddyfile(configFile, adapterName); yes {\n\t\tadapterName = \"caddyfile\"\n\t} else if err != nil {\n\t\treturn nil, \"\", \"\", err\n\t}\n\n\t// load config adapter\n\tif adapterName != \"\" {\n\t\tcfgAdapter = caddyconfig.GetAdapter(adapterName)\n\t\tif cfgAdapter == nil {\n\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"unrecognized config adapter: %s\", adapterName)\n\t\t}\n\t}\n\n\t// adapt config\n\tif cfgAdapter != nil {\n\t\tadaptedConfig, warnings, err := cfgAdapter.Adapt(config, map[string]any{\n\t\t\t\"filename\": configFile,\n\t\t})\n\t\tif err != nil {\n\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"adapting config using %s: %v\", adapterName, err)\n\t\t}\n\t\tlogger.Info(\"adapted config to JSON\", zap.String(\"adapter\", adapterName))\n\t\tfor _, warn := range warnings {\n\t\t\tmsg := warn.Message\n\t\t\tif warn.Directive != \"\" {\n\t\t\t\tmsg = fmt.Sprintf(\"%s: %s\", warn.Directive, warn.Message)\n\t\t\t}\n\t\t\tlogger.Warn(msg,\n\t\t\t\tzap.String(\"adapter\", adapterName),\n\t\t\t\tzap.String(\"file\", warn.File),\n\t\t\t\tzap.Int(\"line\", warn.Line))\n\t\t}\n\t\tconfig = adaptedConfig\n\t} else if len(config) != 0 {\n\t\t// validate that the config is at least valid JSON\n\t\terr = json.Unmarshal(config, new(any))\n\t\tif err != nil {\n\t\t\tif jsonErr, ok := err.(*json.SyntaxError); ok {\n\t\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"config is not valid JSON: %w, at offset %d; did you mean to use a config adapter (the --adapter flag)?\", err, jsonErr.Offset)\n\t\t\t}\n\t\t\treturn nil, \"\", \"\", fmt.Errorf(\"config is not valid JSON: %w; did you mean to use a config adapter (the --adapter flag)?\", err)\n\t\t}\n\t}\n\n\treturn config, configFile, adapterName, nil\n}\n\n// watchConfigFile watches the config file at filename for changes\n// and reloads the config if the file was updated. This function\n// blocks indefinitely; it only quits if the poller has errors for\n// long enough time. The filename passed in must be the actual\n// config file used, not one to be discovered.\n// Each second the config files is loaded and parsed into an object\n// and is compared to the last config object that was loaded\nfunc watchConfigFile(filename, adapterName string) {\n\tdefer func() {\n\t\tif err := recover(); err != nil {\n\t\t\tlog.Printf(\"[PANIC] watching config file: %v\\n%s\", err, debug.Stack())\n\t\t}\n\t}()\n\n\t// make our logger; since config reloads can change the\n\t// default logger, we need to get it dynamically each time\n\tlogger := func() *zap.Logger {\n\t\treturn caddy.Log().\n\t\t\tNamed(\"watcher\").\n\t\t\tWith(zap.String(\"config_file\", filename))\n\t}\n\n\t// get current config\n\tlastCfg, _, _, err := loadConfigWithLogger(nil, filename, adapterName)\n\tif err != nil {\n\t\tlogger().Error(\"unable to load latest config\", zap.Error(err))\n\t\treturn\n\t}\n\n\tlogger().Info(\"watching config file for changes\")\n\n\t// begin poller\n\t//nolint:staticcheck\n\tfor range time.Tick(1 * time.Second) {\n\t\t// get current config\n\t\tnewCfg, _, _, err := loadConfigWithLogger(nil, filename, adapterName)\n\t\tif err != nil {\n\t\t\tlogger().Error(\"unable to load latest config\", zap.Error(err))\n\t\t\treturn\n\t\t}\n\n\t\t// if it hasn''t changed, nothing to do\n\t\tif bytes.Equal(lastCfg, newCfg) {\n\t\t\tcontinue\n\t\t}\n\t\tlogger().Info(\"config file changed; reloading\")\n\n\t\t// remember the current config\n\t\tlastCfg = newCfg\n\n\t\t// apply the updated config\n\t\terr = caddy.Load(lastCfg, false)\n\t\tif err != nil {\n\t\t\tlogger().Error(\"applying latest config\", zap.Error(err))\n\t\t\tcontinue\n\t\t}\n\t}\n}\n\n// Flags wraps a FlagSet so that typed values\n// from flags can be easily retrieved.\ntype Flags struct {\n\t*pflag.FlagSet\n}\n\n// String returns the string representation of the\n// flag given by name. It panics if the flag is not\n// in the flag set.\nfunc (f Flags) String(name string) string {\n\treturn f.FlagSet.Lookup(name).Value.String()\n}\n\n// Bool returns the boolean representation of the\n// flag given by name. It returns false if the flag\n// is not a boolean type. It panics if the flag is\n// not in the flag set.\nfunc (f Flags) Bool(name string) bool {\n\tval, _ := strconv.ParseBool(f.String(name))\n\treturn val\n}\n\n// Int returns the integer representation of the\n// flag given by name. It returns 0 if the flag\n// is not an integer type. It panics if the flag is\n// not in the flag set.\nfunc (f Flags) Int(name string) int {\n\tval, _ := strconv.ParseInt(f.String(name), 0, strconv.IntSize)\n\treturn int(val)\n}\n\n// Float64 returns the float64 representation of the\n// flag given by name. It returns false if the flag\n// is not a float64 type. It panics if the flag is\n// not in the flag set.\nfunc (f Flags) Float64(name string) float64 {\n\tval, _ := strconv.ParseFloat(f.String(name), 64)\n\treturn val\n}\n\n// Duration returns the duration representation of the\n// flag given by name. It returns false if the flag\n// is not a duration type. It panics if the flag is\n// not in the flag set.\nfunc (f Flags) Duration(name string) time.Duration {\n\tval, _ := caddy.ParseDuration(f.String(name))\n\treturn val\n}\n\nfunc loadEnvFromFile(envFile string) error {\n\tfile, err := os.Open(envFile)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"reading environment file: %v\", err)\n\t}\n\tdefer file.Close()\n\n\tenvMap, err := parseEnvFile(file)\n\tif err != nil {\n\t\treturn fmt.Errorf(\"parsing environment file: %v\", err)\n\t}\n\n\tfor k, v := range envMap {\n\t\t// do not overwrite existing environment variables\n\t\t_, exists := os.LookupEnv(k)\n\t\tif !exists {\n\t\t\tif err := os.Setenv(k, v); err != nil {\n\t\t\t\treturn fmt.Errorf(\"setting environment variables: %v\", err)\n\t\t\t}\n\t\t}\n\t}\n\n\t// Update the storage paths to ensure they have the proper\n\t// value after loading a specified env file.\n\tcaddy.ConfigAutosavePath = filepath.Join(caddy.AppConfigDir(), \"autosave.json\")\n\tcaddy.DefaultStorage = \u0026certmagic.FileStorage{Path: caddy.AppDataDir()}\n\n\treturn nil\n}\n\n// parseEnvFile parses an env file from KEY=VALUE format.\n// It''s pretty naive. Limited value quotation is supported,\n// but variable and command expansions are not supported.\nfunc parseEnvFile(envInput io.Reader) (map[string]string, error) {\n\tenvMap := make(map[string]string)\n\n\tscanner := bufio.NewScanner(envInput)\n\tvar lineNumber int\n\n\tfor scanner.Scan() {\n\t\tline := strings.TrimSpace(scanner.Text())\n\t\tlineNumber++\n\n\t\t// skip empty lines and lines starting with comment\n\t\tif line == \"\" || strings.HasPrefix(line, \"#\") {\n\t\t\tcontinue\n\t\t}\n\n\t\t// split line into key and value\n\t\tbefore, after, isCut := strings.Cut(line, \"=\")\n\t\tif !isCut {\n\t\t\treturn nil, fmt.Errorf(\"can''t parse line %d; line should be in KEY=VALUE format\", lineNumber)\n\t\t}\n\t\tkey, val := before, after\n\n\t\t// sometimes keys are prefixed by \"export \" so file can be sourced in bash; ignore it here\n\t\tkey = strings.TrimPrefix(key, 